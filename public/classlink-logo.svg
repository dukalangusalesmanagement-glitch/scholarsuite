<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" preserveAspectRatio="xMidYMid meet">
  <title>ClassLink</title>
  <desc>ClassLink — School Management System wordmark logo</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@900&amp;display=swap');
      .logoText {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        font-size: 260px;
        letter-spacing: -10px;
      }
    </style>

    <linearGradient id="greenGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="75%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <linearGradient id="glossHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-15%" width="120%" height="155%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="0" dy="7"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="textShape">
      <text x="700" y="295" text-anchor="middle" class="logoText">ClassLink</text>
    </clipPath>
  </defs>

  <g filter="url(#softShadow)">
    <text x="700" y="295" text-anchor="middle" class="logoText">
      <tspan fill="url(#greenGradient)">Class</tspan><tspan fill="#ffffff" style="paint-order: stroke; stroke: #16a34a; stroke-width: 11; stroke-linejoin: round;">Link</tspan>
    </text>
  </g>

  <rect x="0" y="0" width="1400" height="210" fill="url(#glossHighlight)" clip-path="url(#textShape)"/>
</svg>
