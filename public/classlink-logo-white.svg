<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" preserveAspectRatio="xMidYMid meet">
  <title>ClassLink</title>
  <desc>ClassLink wordmark logo (light variant for dark backgrounds)</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@900&amp;display=swap');
      .logoText {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 260px;
        letter-spacing: -10px;
      }
    </style>

    <linearGradient id="brightGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <text x="700" y="295" text-anchor="middle" class="logoText">
    <tspan fill="url(#brightGreen)">Class</tspan><tspan fill="#ffffff">Link</tspan>
  </text>
</svg>
